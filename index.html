<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>sily-ui · 工程作品集</title>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.css" />
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/umd/styled.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.35); }
      50%      { box-shadow: 0 0 0 6px rgba(99,102,241,0); }

      from { opacity: 0; transform: translateY(12px); }

    body { background: #ffffff; }

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const {
      ThemeProvider, createTheme, CssBaseline,
      AppBar, Toolbar, Typography, Button, Container, Box,
      Grid, Card, CardContent, CardActions, Chip,
      LinearProgress, Paper, CircularProgress,
      Alert, AlertTitle, Stack, IconButton
    } = MaterialUI;

    // ============ 配置 ============
    const GITHUB_USER = 'sily-ui';
    const CACHE_TTL = 5 * 60 * 1000;

    // ============ 极简高级感主题（Apple/Stripe/Vercel 纯色风） ============
    const theme = createTheme({
      palette: {
        mode: 'light',
        primary: { main: '#111827', light: '#1f2937', dark: '#030712' },
        background: { default: '#ffffff', paper: '#ffffff' },
        text: { primary: '#111827', secondary: '#6B7280' },
        divider: '#E5E7EB'
      },
      typography: {
        fontFamily: '"Inter", "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif',
        h1: { fontWeight: 800, letterSpacing: '-0.04em' },
        h2: { fontWeight: 800, letterSpacing: '-0.04em' },
        h3: { fontWeight: 700, letterSpacing: '-0.03em' },
        h4: { fontWeight: 700, letterSpacing: '-0.03em' },
        h5: { fontWeight: 600 },
        h6: { fontWeight: 600 },
        subtitle1: { fontWeight: 500 }
      },
      shape: { borderRadius: 12 }
    });

    // ============ 工具：开发活跃度（莫兰迪色系） ============
    function calcProgress(pushedAt) {
      const days = (Date.now() - new Date(pushedAt).getTime()) / 86400000;
      if (days <= 7)   return { value: 95, bar: '#86a789', label: '活跃维护' };
      if (days <= 30)  return { value: 80, bar: '#a3c4a8', label: '活跃维护' };
      if (days <= 90)  return { value: 60, bar: '#8b9dc3', label: '稳定迭代' };
      if (days <= 180) return { value: 40, bar: '#a7b0c9', label: '稳定迭代' };
      if (days <= 365) return { value: 25, bar: '#c9a9a9', label: '休眠状态' };
      return { value: 10, bar: '#b0a3b0', label: '休眠状态' };
    }

    function formatRelative(dateStr) {
      if (!dateStr) return '未知';
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return '刚刚';
      if (mins < 60) return `${mins} 分钟前`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} 小时前`;
      const days = Math.floor(hours / 24);
      if (days < 30) return `${days} 天前`;
      if (days < 365) return `${Math.floor(days / 30)} 个月前`;
      return `${Math.floor(days / 365)} 年前`;
    }

    async function fetchWithCache(key, url, force = false) {
      if (!force) {
        try {
          const cached = localStorage.getItem(key);
          if (cached) {
            const { data, ts } = JSON.parse(cached);
            if (Date.now() - ts < CACHE_TTL) return data;
          }
        } catch (e) {}
      }
      const res = await fetch(url);
      if (!res.ok) {
        if (res.status === 403) throw new Error('GitHub 接口限流，请稍后再试');
        if (res.status === 404) throw new Error('用户或仓库不存在');
        throw new Error(`请求失败 (${res.status})`);
      }
      const data = await res.json();
      try { localStorage.setItem(key, JSON.stringify({ data, ts: Date.now() })); } catch (e) {}
      return data;
    }

    const fetchUser  = (force) => fetchWithCache('gh_user_v1',  `https://api.github.com/users/${GITHUB_USER}`, force);
    const fetchRepos = (force) => fetchWithCache('gh_repos_v1', `https://api.github.com/users/${GITHUB_USER}/repos?sort=updated&per_page=100&type=owner`, force);
    async function fetchCommits(repo, force) {
      try {
        return await fetchWithCache(`gh_commits_${repo}`, `https://api.github.com/repos/${GITHUB_USER}/${repo}/commits?per_page=3`, force);
      } catch (e) { return []; }
    }

    // ============ 顶部导航 ============
    function NavBar({ active, setActive }) {
      const menus = [
        { label: '首页', target: 'home' },
        { label: '作品集', target: 'projects' },
        { label: '迭代动态', target: 'updates' }
      ];
      const scrollTo = (t) => {
        setActive(t);
        document.getElementById(t)?.scrollIntoView({ behavior: 'smooth' });
      };
      return (
        <AppBar position="sticky" elevation={0} sx={{ bgcolor: 'rgba(255,255,255,0.85)', backdropFilter: 'blur(12px)', borderBottom: '1px solid', borderColor: 'divider' }}>
          <Toolbar sx={{ maxWidth: 1200, mx: 'auto', width: '100%' }}>
            <Box onClick={() => scrollTo('home')} sx={{ display: 'flex', alignItems: 'center', gap: 1, flexGrow: 1, cursor: 'pointer' }}>
              <svg width="22" height="22" viewBox="0 0 16 16" fill="#111827" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
              </svg>
              <Typography sx={{ fontWeight: 700, color: '#111827', letterSpacing: '-0.01em', fontSize: 17 }}>
                {GITHUB_USER}
              </Typography>
            </Box>
            <Stack direction="row" spacing={0.5}>
              {menus.map(m => (
                <Button
                  key={m.target}
                  onClick={() => scrollTo(m.target)}
                  disableRipple
                  sx={{
                    color: active === m.target ? '#111827' : '#6B7280',
                    fontWeight: active === m.target ? 600 : 500,
                    bgcolor: 'transparent',
                    borderRadius: 2,
                    px: { xs: 1.5, sm: 2 },
                    fontSize: 14,
                    transition: 'color 0.2s',
                    '&:hover': { bgcolor: 'rgba(0,0,0,0.03)', color: '#111827' }
                  }}
                >
                  {m.label}
                </Button>
              ))}
            </Stack>
          </Toolbar>
        </AppBar>
      );
    }

    // ============ Hero 区（纯色 + 大留白） ============
    function Hero({ user }) {
      return (
        <Box id="home" sx={{
          position: 'relative',
          pt: { xs: 12, md: 18 },
          pb: { xs: 12, md: 16 },
          overflow: 'hidden',
          bgcolor: '#ffffff'
        }}>
          <Container maxWidth="md" sx={{ position: 'relative', textAlign: 'center' }}>
            {/* 头像 + 账户信息（移除渐变光晕，回归纯净） */}
            <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, mb: 10 }}>
              <Box sx={{ position: 'relative' }}>
                {user ? (
                  <Box component="img" src={user.avatar_url} alt={user.login}
                    sx={{
                      width: 96, height: 96, borderRadius: '50%', position: 'relative',
                      border: '1px solid #E5E7EB', objectFit: 'cover'
                    }} />
                ) : (
                  <Box sx={{ width: 96, height: 96, borderRadius: '50%', bgcolor: '#F9FAFB', border: '1px solid #E5E7EB' }} />
                )}
              </Box>
              <Box>
                <Typography variant="h6" sx={{ fontWeight: 700, color: '#111827', letterSpacing: '-0.01em' }}>
                  {user?.name || user?.login || GITHUB_USER}
                </Typography>
                <Typography sx={{ mt: 0.5, color: '#6B7280', fontSize: 14 }}>
                  {user?.bio || '开源爱好者 · 持续构建中'}
                </Typography>
              </Box>
              {user && (
                <Stack direction="row" spacing={1.5}>
                  <Chip label={`${user.public_repos ?? 0} 仓库`} size="small"
                    sx={{ bgcolor: '#F9FAFB', color: '#374151', fontWeight: 500, border: '1px solid #E5E7EB' }} />
                  <Chip label={`${user.followers ?? 0} 关注`} size="small"
                    sx={{ bgcolor: '#F9FAFB', color: '#374151', fontWeight: 500, border: '1px solid #E5E7EB' }} />
                </Stack>
              )}
            </Box>

            {/* 主标题：墨黑 #111827，更大字号更深字重 */}
            <Typography sx={{
              fontSize: { xs: '3rem', md: '5rem' },
              fontWeight: 800,
              letterSpacing: '-0.045em',
              lineHeight: 1.05,
              mb: 6,
              color: '#111827',
              animation: 'floatUp 0.7s ease-out'
            }}>
              工程进行时
            </Typography>

            {/* 药丸按钮 */}
            <Stack direction="row" spacing={2} justifyContent="center" sx={{ animation: 'floatUp 0.9s ease-out' }}>
              <Button
                href={user?.html_url || `https://github.com/${GITHUB_USER}`}
                target="_blank" rel="noopener noreferrer"
                disableRipple
                sx={{
                  borderRadius: 999, px: 4, py: 1.3,
                  bgcolor: '#111827', color: '#fff', fontSize: 14, fontWeight: 600,
                  border: '1px solid #111827',
                  boxShadow: 'none',
                  transition: 'all 0.2s ease',
                  textTransform: 'none',
                  '&:hover': { bgcolor: '#030712', transform: 'scale(1.03)' }
                }}
              >
                GitHub 主页
              </Button>
              <Button
                onClick={() => document.getElementById('projects')?.scrollIntoView({ behavior: 'smooth' })}
                disableRipple
                sx={{
                  borderRadius: 999, px: 4, py: 1.3,
                  bgcolor: '#fff', color: '#111827', fontSize: 14, fontWeight: 600,
                  border: '1px solid #E5E7EB',
                  boxShadow: 'none',
                  transition: 'all 0.2s ease',
                  textTransform: 'none',
                  '&:hover': { bgcolor: '#F9FAFB', borderColor: '#D1D5DB', transform: 'scale(1.03)' }
                }}
              >
                浏览作品
              </Button>
            </Stack>
          </Container>
        </Box>
      );
    }

    // ============ 区块标题 ============
    function SectionTitle({ title, subtitle, action }) {
      return (
        <Box sx={{ mb: 6, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 2 }}>
          <Box>
            <Typography variant="h4" sx={{ fontWeight: 700, color: '#111827', letterSpacing: '-0.03em', mb: 1 }}>
              {title}
            </Typography>
            <Typography sx={{ color: '#6B7280', fontSize: 15 }}>{subtitle}</Typography>
          </Box>
          {action}
        </Box>
      );
    }

    // ============ 项目卡片（极简纯色描边风） ============
    function ProjectCard({ repo }) {
      const p = calcProgress(repo.pushed_at);
      return (
        <Card sx={{
          height: '100%', display: 'flex', flexDirection: 'column',
          borderRadius: '16px',
          border: '1px solid #E5E7EB',
          boxShadow: 'none',
          bgcolor: '#ffffff',
          transition: 'all 0.25s ease',
          '&:hover': {
            transform: 'translateY(-3px)',
            borderColor: '#9CA3AF',
            boxShadow: 'none',
            '& .lang-chip': { bgcolor: '#F3F4F6' }
          }
        }}>
          <CardContent sx={{ flexGrow: 1, p: 2.75, pb: 1.5 }}>
            <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', mb: 1.5, gap: 1 }}>
              <Typography sx={{ fontWeight: 600, color: '#111827', fontSize: 17, lineHeight: 1.3, wordBreak: 'break-word', letterSpacing: '-0.01em' }}>
                {repo.name}
              </Typography>
              {repo.language && (
                <Chip
                  label={repo.language}
                  size="small"
                  className="lang-chip"
                  sx={{
                    bgcolor: '#F9FAFB', color: '#374151', fontWeight: 500, fontSize: 12.5,
                    height: 25, border: '1px solid #E5E7EB', flexShrink: 0, transition: 'background-color 0.25s'
                  }}
                />
              )}
            </Box>
            <Typography sx={{ mb: 2.5, minHeight: 44, lineHeight: 1.65, fontSize: 14.5, color: '#6B7280' }}>
              {repo.description || '暂无描述'}
            </Typography>
          </CardContent>

          <Box sx={{ px: 2.75, pb: 1 }}>
            <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', mb: 0.75 }}>
              <Typography sx={{ fontSize: 11.5, color: '#9CA3AF', fontWeight: 500, letterSpacing: '0.04em', textTransform: 'uppercase' }}>
                {p.label}
              </Typography>
              <Typography sx={{ fontSize: 11.5, color: '#6B7280', fontWeight: 600 }}>
                {p.value}%
              </Typography>
            </Box>
            <LinearProgress
              variant="determinate"
              value={p.value}
              sx={{
                height: 3, borderRadius: 2, bgcolor: '#F3F4F6',
                '& .MuiLinearProgress-bar': { borderRadius: 2, bgcolor: p.bar }
              }}
            />
          </Box>

          <CardActions sx={{ justifyContent: 'space-between', px: 2.75, pb: 2.5, pt: 1.5, alignItems: 'center' }}>
            <Stack direction="row" spacing={1.5} sx={{ alignItems: 'center', fontSize: 13.5, color: '#6B7280' }}>
              <Box sx={{ display: 'flex', alignItems: 'center', gap: 0.5 }}>
                <Box component="span" sx={{ fontSize: 14 }}>★</Box>
                <span>{repo.stargazers_count}</span>
              </Box>
              <Box sx={{ width: 3, height: 3, borderRadius: '50%', bgcolor: '#D1D5DB' }} />
              <span>{formatRelative(repo.pushed_at)}</span>
            </Stack>
            <Button
              size="small" href={repo.html_url} target="_blank" rel="noopener noreferrer" disableRipple
              sx={{
                minWidth: 'auto', color: '#6B7280', fontSize: 13.5, fontWeight: 500, px: 1,
                '&:hover': { bgcolor: 'transparent', color: '#111827' }
              }}
            >
              查看 →
            </Button>
          </CardActions>
        </Card>
      );
    }

    // ============ 语言筛选 ============
    function LanguageFilter({ languages, current, onChange }) {
      return (
        <Stack direction="row" spacing={1} sx={{ flexWrap: 'wrap', gap: 1 }}>
          <Chip label="全部" onClick={() => onChange('all')} disableRipple
            sx={{
              height: 30, fontSize: 13, fontWeight: 500,
              bgcolor: current === 'all' ? '#111827' : '#ffffff',
              color: current === 'all' ? '#fff' : '#374151',
              border: '1px solid', borderColor: current === 'all' ? '#111827' : '#E5E7EB',
              '&:hover': { bgcolor: current === 'all' ? '#1f2937' : '#F9FAFB' }
            }} />
          {languages.map(lang => (
            <Chip key={lang} label={lang} onClick={() => onChange(lang)} disableRipple
              sx={{
                height: 30, fontSize: 13, fontWeight: 500,
                bgcolor: current === lang ? '#111827' : '#ffffff',
                color: current === lang ? '#fff' : '#374151',
                border: '1px solid', borderColor: current === lang ? '#111827' : '#E5E7EB',
                '&:hover': { bgcolor: current === lang ? '#1f2937' : '#F9FAFB' }
              }} />
          ))}
        </Stack>
      );
    }

    // ============ 迭代动态时间线（双栏布局，纯色风格） ============
    function UpdatesTimeline({ commits }) {
      if (commits.length === 0) {
        return (
          <Paper elevation={0} sx={{ p: 5, textAlign: 'center', border: '1px solid #E5E7EB', borderRadius: '16px', bgcolor: '#ffffff' }}>
            <Typography sx={{ color: '#6B7280' }}>暂无最近提交记录</Typography>
          </Paper>
        );
      }
      const half = Math.ceil(commits.length / 2);
      const leftCol = commits.slice(0, half);
      const rightCol = commits.slice(half);
      const renderTimeline = (items) => (
        <Box>
          {items.map((c, i) => {
            const isLast = i === items.length - 1;
            return (
              <Box key={c.sha + i} sx={{ display: 'flex', position: 'relative', pb: isLast ? 0 : 3 }}>
                {/* 时间线轴（纯墨黑圆点，无渐变光晕） */}
                <Box sx={{ display: 'flex', flexDirection: 'column', alignItems: 'center', mr: 2.5 }}>
                  <Box sx={{
                    width: 8, height: 8, borderRadius: '50%',
                    bgcolor: '#111827',
                    flexShrink: 0, mt: '8px'
                  }} />
                  {!isLast && (
                    <Box sx={{ width: 1, flex: 1, bgcolor: '#E5E7EB', mt: '4px', mb: '-4px' }} />
                  )}
                </Box>

                {/* 时间线卡片（纯白描边，无阴影） */}
                <Paper elevation={0} sx={{
                  flex: 1, p: 2,
                  border: '1px solid #E5E7EB', borderRadius: '12px',
                  bgcolor: '#ffffff',
                  transition: 'all 0.2s ease',
                  '&:hover': { borderColor: '#9CA3AF', transform: 'translateX(2px)' }
                }}>
                  <Typography sx={{ fontSize: 13.5, fontWeight: 600, color: '#111827', lineHeight: 1.55, wordBreak: 'break-word', mb: 2 }}>
                    {c.message.split('\n')[0]}
                  </Typography>
                  <Stack direction="row" spacing={1} sx={{ alignItems: 'center', flexWrap: 'wrap', gap: 1 }}>
                    <Chip
                      label={c.repo} size="small" component="a" clickable
                      href={c.url} target="_blank" rel="noopener noreferrer"
                      sx={{
                        height: 21, fontSize: 11, fontWeight: 500,
                        bgcolor: '#F9FAFB', color: '#374151', border: '1px solid #E5E7EB'
                      }} />
                    <Box sx={{ width: 3, height: 3, borderRadius: '50%', bgcolor: '#D1D5DB' }} />
                    <Typography sx={{ color: '#6B7280', fontSize: 11.5 }}>
                      {c.author}
                    </Typography>
                    <Box sx={{ width: 3, height: 3, borderRadius: '50%', bgcolor: '#D1D5DB' }} />
                    <Typography sx={{ color: '#6B7280', fontSize: 11.5 }}>
                      {formatRelative(c.date)}
                    </Typography>
                  </Stack>
                </Paper>
              </Box>
            );
          })}
        </Box>
      );
      return (
        <Box sx={{ display: 'grid', gridTemplateColumns: { xs: '1fr', md: '1fr 1fr' }, gap: 3, maxWidth: 1000, mx: 'auto' }}>
          {renderTimeline(leftCol)}
          {renderTimeline(rightCol)}
        </Box>
      );
    }

    // ============ 主应用 ============
    function App() {
      const [active, setActive] = useState('home');
      const [user, setUser] = useState(null);
      const [repos, setRepos] = useState([]);
      const [commits, setCommits] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [filter, setFilter] = useState('all');

      const load = useCallback(async (force = false) => {
        setLoading(true); setError(null);
        try {
          const [u, reposData] = await Promise.all([fetchUser(force), fetchRepos(force)]);
          setUser(u);
          const sorted = [...reposData].sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
          setRepos(sorted);

          const topRepos = sorted.slice(0, 8);
          const results = await Promise.all(topRepos.map(r => fetchCommits(r.name, force)));
          const allCommits = [];
          topRepos.forEach((r, i) => {
            (results[i] || []).forEach(c => {
              allCommits.push({
                sha: c.sha,
                message: c.commit?.message || '',
                author: c.commit?.author?.name || c.commit?.committer?.name || 'unknown',
                date: c.commit?.author?.date || c.commit?.committer?.date || r.pushed_at,
                repo: r.name,
                url: c.html_url
              });
            });
          });
          allCommits.sort((a, b) => new Date(b.date) - new Date(a.date));
          setCommits(allCommits.slice(0, 18));
        } catch (e) {
          setError(e.message || '数据加载失败');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { load(false); }, [load]);

      useEffect(() => {
        const handler = () => {
          const sections = ['home', 'projects', 'updates'];
          let cur = 'home';
          for (const s of sections) {
            const el = document.getElementById(s);
            if (el && el.getBoundingClientRect().top <= 120) cur = s;
          }
          setActive(cur);
        };
        window.addEventListener('scroll', handler);
        return () => window.removeEventListener('scroll', handler);
      }, []);

      const languages = Array.from(new Set(repos.map(r => r.language).filter(Boolean))).sort();
      const filtered = filter === 'all' ? repos : repos.filter(r => r.language === filter);

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />
          <NavBar active={active} setActive={setActive} />
          <Hero user={user} />

          {/* 作品集 */}
          <Container id="projects" maxWidth="xl" sx={{ py: { xs: 6, md: 10 }, px: { xs: 2, sm: 4, md: 6, lg: 8 } }}>
            <SectionTitle
              title="作品集"
              subtitle={`共 ${repos.length} 个公开仓库 · 按最近更新自动排序`}
              action={
                <Button onClick={() => load(true)} disabled={loading} size="small" disableRipple
                  sx={{
                    color: '#6B7280', fontSize: 13, fontWeight: 500, textTransform: 'none',
                    border: '1px solid #E5E7EB', borderRadius: 999, px: 2,
                    '&:hover': { bgcolor: '#F9FAFB', borderColor: '#D1D5DB', color: '#111827' }
                  }}>
                  {loading ? '同步中…' : '↻ 刷新'}
                </Button>
              }
            />

            {loading ? (
              <Box sx={{ textAlign: 'center', py: 10 }}>
                <CircularProgress size={28} sx={{ color: '#111827' }} />
                <Typography sx={{ mt: 2, fontSize: 14, color: '#6B7280' }}>正在从 GitHub 拉取数据…</Typography>
              </Box>
            ) : error ? (
              <Alert severity="warning" sx={{ mb: 3, borderRadius: '12px' }}
                action={<Button color="inherit" size="small" onClick={() => load(true)} sx={{ fontSize: 13 }}>重试</Button>}>
                <AlertTitle sx={{ fontSize: 14 }}>数据加载失败</AlertTitle>
                {error}。GitHub 未授权接口限流为 60 次/小时，请稍后再试。
              </Alert>
            ) : (
              <>
                <Box sx={{ mb: 4 }}>
                  <LanguageFilter languages={languages} current={filter} onChange={setFilter} />
                </Box>
                <Grid container spacing={3}>
                  {filtered.map(repo => (
                    <Grid item xs={12} sm={6} md={4} lg={3} key={repo.id}>
                      <ProjectCard repo={repo} />
                    </Grid>
                  ))}
                </Grid>
                {filtered.length === 0 && (
                  <Typography sx={{ textAlign: 'center', py: 6, color: '#9CA3AF' }} fontSize={14}>
                    该分类下暂无项目
                  </Typography>
                )}
              </>
            )}
          </Container>

          {/* 迭代动态 */}
          <Box id="updates" sx={{ bgcolor: '#ffffff', borderTop: '1px solid #E5E7EB', py: { xs: 8, md: 12 } }}>
            <Container maxWidth="lg">
              <Box sx={{ textAlign: 'center', mb: 8 }}>
                <Typography variant="h4" sx={{ fontWeight: 700, color: '#111827', letterSpacing: '-0.03em', mb: 1 }}>
                  迭代动态
                </Typography>
                <Typography sx={{ color: '#6B7280', fontSize: 15 }}>
                  最近代码提交记录 · 按时间倒序自动同步
                </Typography>
              </Box>
              {loading ? (
                <Box sx={{ textAlign: 'center', py: 6 }}><CircularProgress size={28} sx={{ color: '#111827' }} /></Box>
              ) : error ? (
                <Alert severity="warning" sx={{ borderRadius: '12px', maxWidth: 560, mx: 'auto' }}>提交动态加载失败：{error}</Alert>
              ) : (
                <UpdatesTimeline commits={commits} />
              )}
            </Container>
          </Box>

          {/* 页脚 */}
          <Box sx={{ bgcolor: '#111827', color: '#9CA3AF', py: 5, textAlign: 'center' }}>
            <Typography variant="body2" sx={{ fontSize: 13 }}>
              © {new Date().getFullYear()} · {GITHUB_USER} · 数据自动同步自 GitHub API
            </Typography>
          </Box>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
