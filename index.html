      animation: fadeInUp 0.55s ease both;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const {
      Container, Box, Typography, Button, Chip, Stack,
      CircularProgress, Alert, AlertTitle
    } = MaterialUI;

    const GITHUB_USER = 'sily-ui';
    const CACHE_TTL = 5 * 60 * 1000;

    // 状态色：active 翠绿 / steady 科技蓝 / idle 克制灰
    function calcProgress(pushedAt) {
      const days = (Date.now() - new Date(pushedAt).getTime()) / 86400000;
      if (days <= 7)   return { value: 92, bar: '#10B981', label: 'active' };
      if (days <= 30)  return { value: 76, bar: '#10B981', label: 'active' };
      if (days <= 90)  return { value: 58, bar: '#3B82F6', label: 'steady' };
      if (days <= 180) return { value: 38, bar: '#3B82F6', label: 'steady' };
      if (days <= 365) return { value: 22, bar: '#94A3B8', label: 'idle' };
      return { value: 10, bar: '#94A3B8', label: 'idle' };
    }

    function formatRelative(dateStr) {
      if (!dateStr) return '—';
      const diff = Date.now() - new Date(dateStr).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'now';
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.floor(h / 24);
      if (d < 30) return `${d}d ago`;
      if (d < 365) return `${Math.floor(d / 30)}mo ago`;
      return `${Math.floor(d / 365)}y ago`;
    }

    function shortSha(sha) {
      return (sha || '').slice(0, 7);
    }

    // conventional commit 类型解析 → 颜色 + 标签
    // 颜色语义：feat 翠绿(新增) · fix 科技蓝(修复) · revert 红(回滚) · release 暖金(发布)
    function commitType(message) {
      const m = (message || '').toLowerCase();
      // Conventional Commits 标准 11 种 + 实际项目常见扩展类型
      const prefix = m.match(
        /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|improve|security|hotfix|deps|release|merge|i18n|config|wip)(\(.+\))?:/
      );
      if (!prefix) return { type: 'other', color: '#94A3B8', label: '·' };
      const t = prefix[1];
      const map = {
        // —— Conventional Commits 标准类型（每种独立可辨）——
        feat:     { color: '#10B981', label: 'feat' },      // 新功能 · 翠绿
        fix:      { color: '#3B82F6', label: 'fix' },        // bug 修复 · 科技蓝
        docs:     { color: '#8B5CF6', label: 'docs' },      // 文档 · 紫
        style:    { color: '#06B6D4', label: 'style' },     // 代码风格 · 青
        refactor: { color: '#F59E0B', label: 'refactor' },  // 重构 · 琥珀
        perf:     { color: '#EC4899', label: 'perf' },       // 性能 · 粉
        test:     { color: '#14B8A6', label: 'test' },       // 测试 · 蓝绿
        build:    { color: '#A855F7', label: 'build' },      // 构建 · 浅紫
        ci:       { color: '#6366F1', label: 'ci' },         // CI · 靛蓝
        chore:    { color: '#64748B', label: 'chore' },     // 杂务 · 石板灰
        revert:   { color: '#EF4444', label: 'revert' },    // 回滚 · 红
        // —— 常见扩展类型（避免落到 other ·，提升可辨识度）——
        improve:  { color: '#22C55E', label: 'improve' },   // 改进 · 亮绿
        security: { color: '#DC2626', label: 'security' },  // 安全 · 深红
        hotfix:   { color: '#F97316', label: 'hotfix' },    // 热修复 · 橙
        deps:     { color: '#84CC16', label: 'deps' },       // 依赖 · 青柠
        release:  { color: '#FBBF24', label: 'release' },   // 发布 · 暖金
        merge:    { color: '#7C3AED', label: 'merge' },      // 合并 · 深紫
        i18n:     { color: '#D946EF', label: 'i18n' },       // 国际化 · 洋红
        config:   { color: '#0EA5E9', label: 'config' },     // 配置 · 天蓝
        wip:      { color: '#94A3B8', label: 'wip' }         // 进行中 · 灰
      };
      return map[t] || { type: 'other', color: '#94A3B8', label: '·' };
    }

    async function fetchWithCache(key, url, force = false) {
      // force 刷新时优先返回旧缓存（避免限流期间丢失已有数据）
      const readCache = () => {
        try {
          const cached = localStorage.getItem(key);
          if (!cached) return null;
          const { data, ts } = JSON.parse(cached);
          return { data, ts };
        } catch (e) { return null; }
      };
      const writeCache = (data) => {
        try { localStorage.setItem(key, JSON.stringify({ data, ts: Date.now() })); } catch (e) {}
      };

      if (!force) {
        const c = readCache();
        if (c && Date.now() - c.ts < CACHE_TTL) return c.data;
      }

      try {
        const res = await fetch(url);
        if (!res.ok) {
          if (res.status === 403 || res.status === 429) {
            // 限流：若有旧缓存就用旧数据，避免页面崩溃
            const c = readCache();
            if (c) return c.data;
            throw new Error('GitHub rate-limited, try again in a few minutes');
          }
          if (res.status === 404) throw new Error('user not found');
          throw new Error(`request failed (${res.status})`);
        }
        const data = await res.json();
        writeCache(data);
        return data;
      } catch (e) {
        // 网络异常：若有旧缓存就降级返回
        const c = readCache();
        if (c) return c.data;
        throw e;
      }
    }

    const fetchUser  = (f) => fetchWithCache('gh_user_v3',  `https://api.github.com/users/${GITHUB_USER}`, f);
    const fetchRepos = (f) => fetchWithCache('gh_repos_v3', `https://api.github.com/users/${GITHUB_USER}/repos?sort=updated&per_page=100&type=owner`, f);
    async function fetchCommits(repo, f) {
      try {
        return await fetchWithCache(`gh_c3_${repo}`, `https://api.github.com/repos/${GITHUB_USER}/${repo}/commits?per_page=5`, f);
      } catch (e) { return []; }
    }

    // 语言 → 圆点颜色（GitHub 官方调色板的柔化版）
    const LANG_COLOR = {
      JavaScript: '#E8C547', TypeScript: '#6B8E9F', Python: '#A8B8C4',
      HTML: '#C4956C', CSS: '#A8B8C4', Vue: '#6B8E9F', Java: '#B07A5A',
      Go: '#6BB5C0', Rust: '#B5793A', Shell: '#8AA6B5'
    };
    const langDot = (lang) => LANG_COLOR[lang] || '#A8B8C4';

    // ============ 顶部细线导航 ============
    function NavBar({ active, setActive }) {
      const menus = [
        { label: 'home', target: 'home' },
        { label: 'skills', target: 'skills' },
        { label: 'work', target: 'projects' },
        { label: 'stats', target: 'stats' },
        { label: 'log', target: 'updates' }
      ];
      const scrollTo = (t) => {
        setActive(t);
        document.getElementById(t)?.scrollIntoView({ behavior: 'smooth' });
      };
      return (
        <Box sx={{
          position: 'sticky', top: 0, zIndex: 10,
          bgcolor: 'rgba(245,247,250,0.88)', backdropFilter: 'blur(8px)',
          borderBottom: '1px solid #E1E6EC'
        }}>
          <Container maxWidth="lg" sx={{ px: { xs: 2, sm: 3 } }}>
            <Box sx={{ display: 'flex', alignItems: 'center', height: 56 }}>
              <Box onClick={() => scrollTo('home')} sx={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 1.25, mr: 'auto' }}>
                <svg width="18" height="18" viewBox="0 0 16 16" fill="#1A2332" xmlns="http://www.w3.org/2000/svg">
                  <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                <Box className="font-mono" sx={{ fontSize: 14, color: '#1A2332', fontWeight: 500 }}>
                  {GITHUB_USER}
                </Box>
              </Box>
              <Stack direction="row" spacing={0.5}>
                {menus.map(m => (
                  <Button
                    key={m.target}
                    onClick={() => scrollTo(m.target)}
                    disableRipple
                    className="font-mono"
                    sx={{
                      color: active === m.target ? '#1A2332' : '#5B6B7F',
                      fontWeight: active === m.target ? 600 : 400,
                      bgcolor: 'transparent',
                      minWidth: 'auto', px: 1.5, py: 0.5,
                      fontSize: 13,
                      borderRadius: 1,
                      textTransform: 'none',
                      position: 'relative',
                      '&::after': active === m.target ? {
                        content: '""',
                        position: 'absolute',
                        bottom: 2, left: '50%', transform: 'translateX(-50%)',
                        width: 14, height: 2,
                        bgcolor: '#10B981',
                        borderRadius: 1
                      } : {},
                      '&:hover': { bgcolor: '#EEF2F6', color: '#1A2332' }
                    }}
                  >
                    {m.label}
                  </Button>
                ))}
              </Stack>
            </Box>
          </Container>
        </Box>
      );
    }

    // ============ Hero：不对称两栏，签名是右侧 live commit ============
    function Hero({ user, latestCommit, languages }) {
      const handle = user?.login || GITHUB_USER;
      return (
        <Box id="home" sx={{ borderBottom: '1px solid #E1E6EC' }}>
          <Container maxWidth="lg" sx={{ px: { xs: 2, sm: 3 }, py: { xs: 6, md: 10 } }}>
            <Box sx={{
              display: 'grid',
              gridTemplateColumns: { xs: '1fr', md: '1.2fr 1fr' },
              gap: { xs: 5, md: 8 },
              alignItems: 'center'
            }}>
              {/* 左：身份 */}
              <Box>
                <Box sx={{ display: 'flex', alignItems: 'center', gap: 2.5, mb: 4 }}>
                  {user ? (
                    <Box component="img" src={user.avatar_url} alt={handle}
                      sx={{ width: 56, height: 56, borderRadius: '50%', border: '1px solid #E1E6EC', objectFit: 'cover' }} />
                  ) : (
                    <Box sx={{ width: 56, height: 56, borderRadius: '50%', bgcolor: '#E1E6EC' }} />
                  )}
                  <Box>
                    <Box className="font-mono" sx={{ fontSize: 14, color: '#5B6B7F', mb: 0.25 }}>
                      @{handle}
                    </Box>
                    <Box className="font-display" sx={{ fontSize: 20, fontWeight: 600, color: '#1A2332' }}>
                      {user?.name || handle}
                    </Box>
                  </Box>
                </Box>

                <Typography className="font-display" sx={{
                  fontSize: { xs: '3rem', md: '4rem' },
                  fontWeight: 700,
                  letterSpacing: '-0.03em',
                  lineHeight: 1.05,
                  color: '#1A2332',
                  mb: 3
                }}>
                  builds things<br/>
                  <Box component="span" sx={{ color: '#6B8E9F' }}>with React.</Box>
                </Typography>

                <Box className="font-mono" sx={{ fontSize: 17, color: '#5B6B7F', mb: 5, maxWidth: 420, lineHeight: 1.7 }}>
                  {user?.bio || 'open-source work, synced from github. this page updates itself — no manual edits.'}
                </Box>

                <Box sx={{ display: 'flex', gap: 2, flexWrap: 'wrap' }}>
                  <Button
                    href={user?.html_url || `https://github.com/${GITHUB_USER}`}
                    target="_blank" rel="noopener noreferrer"
                    disableRipple
                    className="font-mono"
                    sx={{
                      bgcolor: '#1A2332', color: '#F5F7FA',
                      fontSize: 13, fontWeight: 500, textTransform: 'none',
                      px: 2.5, py: 1, borderRadius: 1,
                      boxShadow: 'none',
                      '&:hover': { bgcolor: '#2A3548' }
                    }}
                  >
                    → github
                  </Button>
                  <Button
                    onClick={() => document.getElementById('projects')?.scrollIntoView({ behavior: 'smooth' })}
                    disableRipple
                    className="font-mono"
                    sx={{
                      bgcolor: 'transparent', color: '#1A2332',
                      fontSize: 13, fontWeight: 500, textTransform: 'none',
                      px: 2.5, py: 1, borderRadius: 1,
                      border: '1px solid #E1E6EC',
                      '&:hover': { bgcolor: '#EEF2F6', borderColor: '#C4CDD6' }
                    }}
                  >
                    ↓ work
                  </Button>
                </Box>

                {user && (
                  <Box className="font-mono" sx={{ mt: 5, display: 'flex', gap: 3, fontSize: 16, color: '#5B6B7F' }}>
                    <Box><Box component="span" sx={{ color: '#1A2332', fontWeight: 600 }}>{user.public_repos ?? 0}</Box> repos</Box>
                    <Box><Box component="span" sx={{ color: '#1A2332', fontWeight: 600 }}>{user.followers ?? 0}</Box> followers</Box>
                    <Box><Box component="span" sx={{ color: '#1A2332', fontWeight: 600 }}>{user.following ?? 0}</Box> following</Box>
                  </Box>
                )}
              </Box>

              {/* 右：身份状态卡 — 终端之上叠加状态/链接/栈 */}
              <Box sx={{
                display: 'flex', flexDirection: 'column', gap: 2.5,
                maxWidth: 420, width: '100%',
                justifySelf: { md: 'end' }
              }}>
                <Box sx={{
                  bgcolor: '#FFFFFF',
                  border: '1px solid #E1E6EC',
                  borderRadius: 1.5,
                  overflow: 'hidden'
                }}>
                  <Box sx={{ px: 2, py: 1.25, borderBottom: '1px solid #E1E6EC', display: 'flex', alignItems: 'center', gap: 1 }}>
                    <Box sx={{ width: 6, height: 6, borderRadius: '50%', bgcolor: '#C4956C' }} />
                    <Box className="font-mono" sx={{ fontSize: 15, color: '#5B6B7F' }}>
                      {latestCommit ? formatRelative(latestCommit.date) : '—'} · main
                    </Box>
                  </Box>
                  <Box sx={{ p: 2.5 }}>
                    <Box className="font-mono" sx={{ fontSize: 15, color: '#8AA6B5', mb: 1.5 }}>
                      $ git log -1
                    </Box>
                    {latestCommit ? (
                      <>
                        <Box className="font-mono" sx={{ fontSize: 16, color: '#6B8E9F', mb: 1 }}>
                          commit <Box component="span" sx={{ color: '#1A2332' }}>{shortSha(latestCommit.sha)}</Box>
                        </Box>
                        <Box className="font-mono" sx={{ fontSize: 16, color: '#1A2332', mb: 1.5, lineHeight: 1.65, wordBreak: 'break-word' }}>
                          {latestCommit.message.split('\n')[0]}
                        </Box>
                        <Box className="font-mono" sx={{ fontSize: 15, color: '#5B6B7F', display: 'flex', gap: 1.5, flexWrap: 'wrap' }}>
                          <Box component="a" href={latestCommit.url} target="_blank" rel="noopener noreferrer"
                            sx={{ color: '#6B8E9F', textDecoration: 'none', '&:hover': { textDecoration: 'underline' } }}>
                            {latestCommit.repo}
                          </Box>
                          <Box>·</Box>
                          <Box>{latestCommit.author}</Box>
                        </Box>
                      </>
                    ) : (
                      <Box className="font-mono" sx={{ fontSize: 16, color: '#8AA6B5' }}>
                        loading latest commit…
                      </Box>
                    )}
                  </Box>
                </Box>

                <Box sx={{ bgcolor: '#FFFFFF', border: '1px solid #E1E6EC', borderRadius: 1.5, p: 2.5, display: 'flex', flexDirection: 'column', gap: 2.25 }}>
                  <Box sx={{ display: 'flex', alignItems: 'center', gap: 2.25, flexWrap: 'wrap' }}>
                    <Box className="font-mono" sx={{ fontSize: 13, color: '#5B6B7F' }}>
                      <Box component="span" sx={{ color: '#10B981', fontWeight: 600 }}>●</Box> open to work
                    </Box>
                    <Box className="font-mono" sx={{ fontSize: 13, color: '#5B6B7F' }}>
                      <Box component="span" sx={{ color: '#6B8E9F' }}>◉</Box> based in <Box component="span" sx={{ color: '#1A2332', fontWeight: 500 }}>{user?.location || 'Asia/Shanghai'}</Box>
                    </Box>
                  </Box>

                  <Box sx={{ display: 'flex', gap: 1.25, flexWrap: 'wrap' }}>
                    {(user?.blog || `https://github.com/${GITHUB_USER}`) && (
                      <Box component="a" href={user?.blog || `https://github.com/${GITHUB_USER}`} target="_blank" rel="noopener noreferrer"
                        className="font-mono" sx={{ fontSize: 12, color: '#5B6B7F', textDecoration: 'none', border: '1px solid #E1E6EC', borderRadius: 1, px: 1.25, py: 0.5, transition: 'all 0.18s ease', '&:hover': { borderColor: '#10B981', color: '#10B981' } }}>
                        site
                      </Box>
                    )}
                    {(user?.twitter_username || user?.email) && (
                      <Box className="font-mono" sx={{ fontSize: 12, color: '#5B6B7F', border: '1px solid #E1E6EC', borderRadius: 1, px: 1.25, py: 0.5, transition: 'all 0.18s ease', '&:hover': { borderColor: '#10B981', color: '#10B981' }, cursor: 'pointer' }}>
                        {user?.twitter_username ? '@' + user.twitter_username : user?.email}
                      </Box>
                    )}
                    <Box className="font-mono" sx={{ fontSize: 12, color: '#5B6B7F', border: '1px solid #E1E6EC', borderRadius: 1, px: 1.25, py: 0.5, transition: 'all 0.18s ease', '&:hover': { borderColor: '#10B981', color: '#10B981' }, cursor: 'pointer' }}>
                      {user?.company || GITHUB_USER}
                    </Box>

    // ============ 主应用 ============
    function useCountUp(target, duration = 1200) {
      const [current, setCurrent] = useState(0);
      const [started, setStarted] = useState(false);
      useEffect(() => {
        if (started) return;
        const el = document.getElementById('stats');
        if (!el) return;
        const onEnter = () => {
          setStarted(true);
          const start = performance.now();
          const tick = (now) => {
            const progress = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            setCurrent(Math.round(target * eased));
            if (progress < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        };
        const observer = new IntersectionObserver(entries => {
          if (entries[0].isIntersecting) onEnter();
        }, { threshold: 0.35 });
        observer.observe(el);
        return () => observer.disconnect();
      }, [target, duration, started]);
      return current;
    }

    function CountUpStat({ value, color, suffix = '' }) {
      const display = useCountUp(value);
      return (
        <Box className="font-mono" sx={{ fontSize: 28, color, fontWeight: 600 }}>
          {display.toLocaleString()}{suffix}
        </Box>
      );
    }

    function App() {
      const [active, setActive] = useState('home');
      const [user, setUser] = useState(null);
      const [repos, setRepos] = useState([]);
      const [commits, setCommits] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [filter, setFilter] = useState('all');

      const load = useCallback(async (force = false) => {
        setLoading(true); setError(null);
        try {
          const [u, reposData] = await Promise.all([fetchUser(force), fetchRepos(force)]);
          setUser(u);
          const sorted = [...reposData].sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
          setRepos(sorted);

          const topRepos = sorted.slice(0, 12);
          const results = await Promise.all(topRepos.map(r => fetchCommits(r.name, force)));
          const all = [];
          topRepos.forEach((r, i) => {
            (results[i] || []).forEach(c => {
              all.push({
                sha: c.sha,
                message: c.commit?.message || '',
                author: c.commit?.author?.name || c.commit?.committer?.name || 'unknown',
                date: c.commit?.author?.date || c.commit?.committer?.date || r.pushed_at,
                repo: r.name,
                url: c.html_url
              });
            });
          });
          all.sort((a, b) => new Date(b.date) - new Date(a.date));
          setCommits(all.slice(0, 24));
        } catch (e) {
          setError(e.message || 'failed to load');
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { load(false); }, [load]);

      useEffect(() => {
        const handler = () => {
          const sections = ['home', 'skills', 'projects', 'stats', 'updates'];
          let cur = 'home';
          for (const s of sections) {
            const el = document.getElementById(s);
            if (el && el.getBoundingClientRect().top <= 120) cur = s;
          }
          setActive(cur);
        };
        window.addEventListener('scroll', handler);
        return () => window.removeEventListener('scroll', handler);
      }, []);

      const languages = Array.from(new Set(repos.map(r => r.language).filter(Boolean))).sort();
      const filtered = filter === 'all' ? repos : repos.filter(r => r.language === filter);
      const latestCommit = commits[0] || null;

      return (
        <Box>
          <NavBar active={active} setActive={setActive} />
          <Hero user={user} latestCommit={latestCommit} languages={languages} />

          <Box id="skills" sx={{ borderBottom: '1px solid #E1E6EC' }}>
            <Container maxWidth="lg" sx={{ px: { xs: 2, sm: 3 }, py: { xs: 6, md: 8 } }}>
              <SectionHead label="skills" />
              <Box sx={{ display: 'grid', gridTemplateColumns: { xs: '1fr', md: 'repeat(3, 1fr)' }, gap: 4 }}>
                {[
                  { title: 'frontend', dot: '#10B981', items: ['React', 'TypeScript', 'Next.js', 'Tailwind CSS', 'MUI'] },
                  { title: 'tooling',  dot: '#3B82F6', items: ['Git', 'GitHub Actions', 'Vite', 'Webpack', 'Docker'] },
                  { title: 'interests', dot: '#FBBF24', items: ['Open Source', 'Design Systems', 'DX', 'Automation', 'Creative Coding'] }
                ].map((card) => (
                  <Box key={card.title} sx={{
                    bgcolor: '#FFFFFF', border: '1px solid #E1E6EC', borderRadius: 1.5, p: 3
                  }}>
                    <Box className="font-mono" sx={{ fontSize: 13, color: '#6B8E9F', fontWeight: 600, mb: 1.75, textTransform: 'uppercase', letterSpacing: '0.08em' }}>
                      {card.title}
                    </Box>
                    <Box sx={{ display: 'flex', flexDirection: 'column', gap: 0.85 }}>
                      {card.items.map(item => (
                        <Box key={item} className="font-mono" sx={{ fontSize: 15, color: '#5B6B7F', display: 'flex', alignItems: 'center', gap: 1 }}>
                          <Box sx={{ width: 6, height: 6, borderRadius: '50%', bgcolor: card.dot }} /> {item}
                        </Box>
                      ))}
                    </Box>
                  </Box>
                ))}
              </Box>
            </Container>
          </Box>

          {/* work */}
          <Box id="projects" sx={{ borderBottom: '1px solid #E1E6EC' }}>
            <Container maxWidth="lg" sx={{ px: { xs: 2, sm: 3 }, py: { xs: 6, md: 8 } }}>
              <SectionHead
                label="work"
                count={repos.length}
                hint="sorted by recent activity"
                action={
                  <Button
                    onClick={() => load(true)} disabled={loading} disableRipple
                    className="font-mono"
                    sx={{
                      color: '#5B6B7F', fontSize: 12, fontWeight: 500, textTransform: 'none',
                      border: '1px solid #E1E6EC', borderRadius: 1, px: 1.5, py: 0.5,
                      '&:hover': { bgcolor: '#EEF2F6', borderColor: '#C4CDD6', color: '#1A2332' }

            </Container>
          </Box>

          <Box id="stats" sx={{ borderBottom: '1px solid #E1E6EC' }}>
            <Container maxWidth="lg" sx={{ px: { xs: 2, sm: 3 }, py: { xs: 6, md: 8 } }}>
              <SectionHead label="stats" hint="derived from public repos" />
              <Box sx={{ display: 'grid', gridTemplateColumns: { xs: '1fr', md: 'repeat(4, 1fr)' }, gap: 4 }}>
                {[
                  { label: 'total stars',       value: repos.reduce((s, r) => s + (r.stargazers_count || 0), 0), color: '#FBBF24' },
                  { label: 'total forks',        value: repos.reduce((s, r) => s + (r.forks_count || 0), 0),    color: '#6B8E9F' },
                  { label: 'commits synced',     value: commits.length,                                              color: '#10B981' },
                  { label: 'languages tracked', value: languages.length,                                            color: '#1A2332' }
                ].map((s) => (
                  <Box key={s.label} sx={{
                    bgcolor: '#FFFFFF', border: '1px solid #E1E6EC', borderRadius: 1.5, p: 3,
                    display: 'flex', flexDirection: 'column', gap: 0.75,
                    }}>
                    <Box className="font-mono" sx={{ fontSize: 12, color: '#8AA6B5', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{s.label}</Box>
                    <CountUpStat value={s.value} color={s.color} />
                  </Box>
                ))}
              </Box>
            </Container>
          </Box>

          {/* log */}
          <Box id="updates" sx={{ bgcolor: '#F5F7FA' }}>
            <Container maxWidth="lg" sx={{ px: { xs: 2, sm: 3 }, py: { xs: 6, md: 8 } }}>
              <SectionHead
                label="log"
                count={commits.length}
                hint="recent commits across repos"
              />
              {loading ? (
                <Box sx={{ py: 6, textAlign: 'center' }}>
                  <CircularProgress size={22} sx={{ color: '#6B8E9F' }} />
                </Box>
              ) : error ? (
                <Alert severity="warning" sx={{ borderRadius: 1.5, bgcolor: '#FFFFFF', border: '1px solid #E1E6EC' }}>
                  <Box className="font-mono" sx={{ fontSize: 12 }}>couldn't load commits: {error}</Box>
                </Alert>
              ) : (
                <UpdatesList commits={commits} />
              )}
            </Container>
          </Box>

          {/* footer */}
          <Box sx={{ borderTop: '1px solid #E1E6EC' }}>
            <Container maxWidth="lg" sx={{ px: { xs: 2, sm: 3 }, py: 4 }}>
              <Box sx={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 1 }}>
                <Box className="font-mono" sx={{ fontSize: 11, color: '#8AA6B5' }}>
                  © {new Date().getFullYear()} · {GITHUB_USER}
                </Box>
                <Box className="font-mono" sx={{ fontSize: 11, color: '#8AA6B5' }}>
                  synced from github api · no manual edits
                </Box>
              </Box>
            </Container>
          </Box>
        </Box>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
